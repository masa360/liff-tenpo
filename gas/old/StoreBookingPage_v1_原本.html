<!--
  ============================================================
  StoreBookingPage.html — 店舗予約入力画面（GAS HTMLサービス用）
  ============================================================
  これは GAS 上で稼働中の実物のバックアップ控え（2026-06-04 取得）。
  GAS の HTML ファイル名「StoreBookingPage」に貼り付けて運用している
  （Code.store.gs の doGet が createTemplateFromFile('StoreBookingPage') で呼ぶ）。

  ■ 既知の不具合（本番運用前に修正推奨）
    submitReservation() 内で notes に 'GAS HTML Service' をハードコードしている。
    そのため Reservations シートの「ご要望」列が全行 'GAS HTML Service' になる。
    店舗予約にはご要望入力UIが無いため、本来は空文字でよい（notes: '' にする）。
    詳細は gas/reservation-only-user-and-store-v4/README.md の補足を参照。

  ■ メニュー・スタッフは顧客ごとに差し替える
    STAFF_LIST / MENUS は Hair Boutique 向けの値。新規顧客では入れ替える。
  ============================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗予約入力</title>
  <style>
    :root {
      --primary: #8b6f3f;
      --primary-light: #d4c5a9;
      --accent: #d47d3f;
      --danger: #c41e3a;
      --danger-light: #f5e6e6;
      --bg-base: #f9f7f2;
      --bg-card: #ffffff;
      --border: #e8e3d8;
      --text-primary: #2d2d2d;
      --text-secondary: #666666;
      --text-muted: #999999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    header p {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--primary);
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    header p.subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .mode-tabs button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-tabs button.active {
      background: var(--primary);
      color: white;
    }

    .mode-tabs button:not(.active) {
      background: #f0f0f0;
      color: var(--text-secondary);
    }

    .progress-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-bar li {
      flex: 1;
      list-style: none;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      background: rgba(255, 255, 255, 0.6);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .progress-bar li.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .progress-bar li.done {
      background: #e8f5e9;
      color: #2e7d32;
      border-color: #2e7d32;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .message.success {
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #4caf50;
    }

    .message.error {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      display: none;
    }

    .panel.active {
      display: block;
    }

    .panel h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      font-size: 12px;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .customer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .customer-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .customer-button:hover {
      border-color: var(--primary);
      background: #fafafa;
    }

    .customer-button.repeater {
      border: 2px solid var(--primary-light);
      background: rgba(212, 197, 169, 0.1);
    }

    .customer-name {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .customer-kana {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .customer-last-visit {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    .repeater-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 8px;
    }

    .new-customer-btn {
      width: 100%;
      padding: 16px;
      border: 2px dashed var(--primary);
      background: white;
      border-radius: 12px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .new-customer-btn:hover {
      background: var(--primary-light);
    }

    label {
      display: block;
      margin-bottom: 12px;
    }

    label span {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus {
      border-color: var(--primary);
      background: #fafafa;
    }

    .time-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .time-button {
      padding: 12px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .time-button:hover {
      border-color: var(--primary);
    }

    .time-button.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .time-button:disabled {
      background: #f0f0f0;
      color: var(--text-muted);
      cursor: not-allowed;
      border-color: #e0e0e0;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .summary-table dt {
      display: inline-block;
      width: 40%;
      color: var(--text-secondary);
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .summary-table dd {
      display: inline-block;
      width: 60%;
      text-align: right;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    .repeat-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #1b5e20;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .action-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .action-button.primary {
      background: var(--primary);
      color: white;
    }

    .action-button.primary:hover {
      opacity: 0.9;
    }

    .action-button.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .action-button.secondary {
      background: white;
      border: 2px solid var(--border);
      color: var(--text-primary);
    }

    .action-button.secondary:hover {
      border-color: var(--primary);
      background: #fafafa;
    }

    .action-button.danger {
      background: var(--danger);
      color: white;
    }

    .action-button.danger:hover {
      opacity: 0.9;
    }

    .reservation-card {
      background: var(--danger-light);
      border: 1px solid var(--danger);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .reservation-date {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .reservation-menu {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .reservation-staff {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .empty-message {
      text-align: center;
      padding: 24px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .repeat-choice-message {
      background: var(--primary-light);
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--primary);
    }

    .repeat-content-box {
      background: var(--primary-light);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 12px;
    }

    .repeat-content-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .repeat-content-text {
      font-weight: 600;
      color: var(--text-primary);
    }

    @media (max-width: 480px) {
      .time-slots {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <p>STORE</p>
      <h1>店舗予約入力</h1>
      <p class="subtitle"><strong>リピーターは一覧の上に出ます。</strong>ヨミで検索 → 前回どおりかだけ選ぶ → 日時で完了。</p>
    </header>

    <ol class="progress-bar" id="progressBar"></ol>

    <div id="messageArea"></div>

    <!-- Customer Selection Step -->
    <div class="panel active" id="panelCustomer">
      <div class="mode-tabs">
        <button class="active" id="btnModeBook" onclick="setMode('book')">予約する</button>
        <button id="btnModeCancel" onclick="setMode('cancel')">キャンセルする</button>
      </div>

      <h2>お客様を選ぶ</h2>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="例）ヤマダ・やまだ・山田（空欄＝リピーター一覧）"
        oninput="handleSearch()"
      />

      <div id="repeatersContainer" style="display: none;">
        <h3 style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600;">直近のリピーター</h3>
        <div class="customer-list" id="repeatersList"></div>
      </div>

      <div id="searchResultsContainer" style="display: none;">
        <h3 style="font-size: 12px; color: var(--primary); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">検索結果</h3>
        <div class="customer-list" id="searchResultsList"></div>
      </div>

      <div id="allCustomersContainer">
        <h3 style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600;">初回・履歴なし</h3>
        <div class="customer-list" id="allCustomersList"></div>
      </div>

      <button class="new-customer-btn" onclick="startNewCustomer()">＋ 新規のお客様（名前入力へ）</button>
    </div>

    <!-- Repeat Choice Step (Book Mode) -->
    <div class="panel" id="panelRepeatChoice">
      <h2>リピーター: 前回と同じ？</h2>
      <div id="repeatChoiceContent"></div>
      <div style="display: grid; gap: 12px;">
        <button class="action-button primary" onclick="handleRepeatChoice(true)">
          前回と同じ（メニュー・担当はそのまま）<br><span style="font-size: 12px;">次の画面で日付と時間だけ選べば完了です</span>
        </button>
        <button class="action-button secondary" onclick="handleRepeatChoice(false)">メニュー・担当を変える</button>
        <button class="back-btn" onclick="goBackToCustomer()">お客様選択に戻る</button>
      </div>
    </div>

    <!-- Menu Selection Step (Book Mode) -->
    <div class="panel" id="panelMenu">
      <h2>
        メニュー・担当
        <button class="back-btn" onclick="backFromMenu()">戻る</button>
      </h2>

      <div id="newCustomerNameField" style="display: none;">
        <label>
          <span>お客様のお名前（必須）</span>
          <input type="text" id="newDisplayName" placeholder="例）山田 花子" />
        </label>
      </div>

      <div id="existingCustomerDisplay" style="display: none; margin-bottom: 16px; font-size: 13px;">
        お客様: <span id="existingCustomerName" style="font-weight: 600;"></span>
      </div>

      <label>
        <span>メニュー</span>
        <select id="menuSelect" onchange="updateMenu()">
          <option value="">選択してください</option>
        </select>
      </label>

      <label>
        <span>担当</span>
        <select id="staffSelect" onchange="updateStaff()">
          <option value="">選択してください</option>
        </select>
      </label>

      <button class="action-button primary" onclick="goMenuNext()">日時を選ぶ</button>
    </div>

    <!-- Date/Time Selection Step (Book Mode) -->
    <div class="panel" id="panelDateTime">
      <h2>
        日時
        <button class="back-btn" onclick="backFromDatetime()">戻る</button>
      </h2>

      <div id="repeatContentDisplay" class="repeat-content-box" style="display: none;">
        <div class="repeat-content-label">予約内容（前回と同じ）</div>
        <div class="repeat-content-text" id="repeatContentText"></div>
      </div>

      <label>
        <span>日付</span>
        <input type="date" id="dateInput" onchange="handleDateChange()" />
      </label>

      <div>
        <span style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500;">開始時刻（30分刻み）</span>
        <div class="time-slots" id="timeSlots"></div>
      </div>

      <button class="action-button primary" onclick="goDatetimeNext()" style="margin-top: 16px;">内容を確認</button>
    </div>

    <!-- Confirm Step (Book Mode) -->
    <div class="panel" id="panelConfirm">
      <h2>
        確認
        <button class="back-btn" onclick="backFromConfirm()">戻る</button>
      </h2>

      <div id="repeatBadge" class="repeat-badge" style="display: none;">
        リピート予約（前回と同じコース）
      </div>

      <dl class="summary-table">
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);">
          <dt style="color:var(--text-secondary);">お客様</dt>
          <dd id="confirmCustomerName" style="font-weight:500;"></dd>
        </div>
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);">
          <dt style="color:var(--text-secondary);">メニュー</dt>
          <dd id="confirmMenuName" style="font-weight:500;"></dd>
        </div>
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);">
          <dt style="color:var(--text-secondary);">担当</dt>
          <dd id="confirmStaffName" style="font-weight:500;"></dd>
        </div>
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);">
          <dt style="color:var(--text-secondary);">日時</dt>
          <dd id="confirmDateTime" style="font-weight:500;"></dd>
        </div>
      </dl>

      <button class="action-button primary" id="submitBtn" onclick="submitReservation()">予約を登録する</button>
    </div>

    <!-- Cancel Selection Step (Cancel Mode) -->
    <div class="panel" id="panelCancelSelect">
      <h2>
        <span id="cancelSelectTitle"></span> のキャンセル対象
        <button class="back-btn" onclick="goBackToCustomer()">戻る</button>
      </h2>
      <div id="cancelReservationsList"></div>
    </div>

    <!-- Cancel Confirm Step (Cancel Mode) -->
    <div class="panel" id="panelCancelConfirm">
      <h2>キャンセル確認</h2>
      <div class="reservation-card" id="cancelConfirmContent"></div>
      <button class="action-button danger" id="cancelBtn" onclick="submitCancel()">キャンセルを確定する</button>
      <button class="back-btn" onclick="goBackToCancelSelect()">← 予約選択に戻る</button>
    </div>
  </div>

  <script>
    // ============================================================
    // Constants
    // ============================================================

    var STAFF_LIST = [
      { id: 'staff-00', name: '指名なし' },
      { id: 'staff-01', name: '山本 宏美' },
      { id: 'staff-02', name: '小川 あずさ' },
    ];

    var MENUS = [
      { id: 'cut-01', name: 'デザインカット', durationMinutes: 45, price: 5000 },
      { id: 'cut-color', name: 'カット ＋ カラー', durationMinutes: 120, price: 13200 },
      { id: 'color', name: 'リタッチカラー', durationMinutes: 90, price: 8200 },
      { id: 'perm', name: 'デザインパーマ', durationMinutes: 100, price: 9800 },
      { id: 'care', name: '炭酸ヘッドスパ', durationMinutes: 20, price: 2500 },
      { id: 'cut-care', name: 'カット ＋ ヘッドスパ', durationMinutes: 60, price: 7200 },
    ];

    // ============================================================
    // State Management
    // ============================================================

    var state = {
      mode: 'book',
      step: 'customer',
      customers: [],
      customer: null,
      isNewCustomer: false,
      newDisplayName: '',
      menuId: null,
      staffId: 'staff-00',
      date: todayYmd(),
      time: null,
      useLastContent: null,
      cancelReservations: [],
      selectedEventId: null,
      availableSlots: [],
    };

    // ============================================================
    // Utility Functions
    // ============================================================

    function todayYmd() {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function showMessage(text, isSuccess) {
      var area = document.getElementById('messageArea');
      var div = document.createElement('div');
      div.className = 'message ' + (isSuccess ? 'success' : 'error');
      div.textContent = text;
      if (isSuccess) {
        var btn = document.createElement('button');
        btn.textContent = 'トップに戻る';
        btn.className = 'action-button primary';
        btn.style.cssText = 'margin-top:12px;width:100%;';
        btn.onclick = function() { area.innerHTML = ''; resetState(); window.scrollTo(0, 0); };
        div.appendChild(btn);
      }
      area.innerHTML = '';
      area.appendChild(div);
      if (!isSuccess) {
        setTimeout(function() { area.innerHTML = ''; }, 4000);
      }
    }

    function gasRun(fnName, arg, successCb, failCb) {
      var runner = google.script.run
        .withSuccessHandler(successCb || function(){})
        .withFailureHandler(failCb || function(e) {
          showMessage(e && e.message ? e.message : String(e), false);
        });
      if (arg !== undefined) {
        runner[fnName](arg);
      } else {
        runner[fnName]();
      }
    }

    function setStep(step) {
      state.step = step;
      render();
      if (step === 'datetime') {
        loadAvailableSlots();
      }
    }

    function setMode(mode) {
      state.mode = mode;
      state.step = 'customer';
      state.customer = null;
      state.isNewCustomer = false;
      state.newDisplayName = '';
      state.menuId = null;
      state.staffId = 'staff-00';
      state.useLastContent = null;
      state.selectedEventId = null;
      state.cancelReservations = [];
      state.time = null;
      document.getElementById('searchInput').value = '';
      render();
    }

    // ============================================================
    // Customer Loading and Searching
    // ============================================================

    function loadCustomers() {
      gasRun('gasListStoreCustomers', undefined, function(result) {
        if (result.success && result.customers) {
          state.customers = result.customers;
        } else {
          state.customers = [];
        }
        render();
      });
    }

    function rankCustomers(query) {
      if (!query) {
        var repeaters = state.customers.filter(function(c) { return !!c.lastReservation; });
        repeaters.sort(function(a, b) {
          var aDate = a.lastReservation ? a.lastReservation.date : '';
          var bDate = b.lastReservation ? b.lastReservation.date : '';
          return bDate < aDate ? -1 : bDate > aDate ? 1 : 0;
        });
        var others = state.customers.filter(function(c) { return !c.lastReservation; });
        others.sort(function(a, b) { return a.displayName < b.displayName ? -1 : 1; });
        return { repeaters: repeaters, others: others, search: null };
      }

      var searchRanked = state.customers.filter(function(c) {
        var q = query.toLowerCase();
        var dn = c.displayName.toLowerCase();
        var sk = (c.searchKana || '').toLowerCase();
        return dn.includes(q) || sk.includes(q);
      });

      searchRanked.sort(function(a, b) {
        var q = query.toLowerCase();
        var aDn = a.displayName.toLowerCase();
        var aSk = (a.searchKana || '').toLowerCase();
        var bDn = b.displayName.toLowerCase();
        var bSk = (b.searchKana || '').toLowerCase();
        var aScore = aDn.indexOf(q) >= 0 ? 100 : (aSk.indexOf(q) >= 0 ? 50 : 0);
        var bScore = bDn.indexOf(q) >= 0 ? 100 : (bSk.indexOf(q) >= 0 ? 50 : 0);
        return bScore - aScore;
      });

      return { repeaters: [], others: [], search: searchRanked };
    }

    function handleSearch() {
      render();
    }

    function startNewCustomer() {
      state.customer = null;
      state.isNewCustomer = true;
      state.newDisplayName = '';
      state.menuId = null;
      state.staffId = 'staff-00';
      state.useLastContent = null;
      setStep('menu');
    }

    function pickCustomer(cust) {
      state.customer = cust;
      state.isNewCustomer = false;
      state.newDisplayName = '';
      state.menuId = null;
      state.staffId = 'staff-00';
      state.useLastContent = null;
      state.time = null;

      if (state.mode === 'cancel') {
        loadCancelReservations(cust);
        return;
      }

      if (cust.lastReservation) {
        setStep('repeat_choice');
      } else {
        setStep('menu');
      }
    }

    function goBackToCustomer() {
      state.customer = null;
      state.isNewCustomer = false;
      state.menuId = null;
      state.time = null;
      document.getElementById('searchInput').value = '';
      setStep('customer');
    }

    // ============================================================
    // Reservation Flow (Book Mode)
    // ============================================================

    function handleRepeatChoice(same) {
      state.useLastContent = same;
      if (same && state.customer && state.customer.lastReservation) {
        // GAS returns menuName (not menuId) — reverse lookup by name
        var menuObj = MENUS.find(function(m) {
          return m.name === state.customer.lastReservation.menuName;
        });
        state.menuId = menuObj ? menuObj.id : null;
        state.staffId = state.customer.lastReservation.staffId || 'staff-00';
        setStep('datetime');
      } else {
        state.menuId = null;
        state.staffId = 'staff-00';
        setStep('menu');
      }
    }

    function backFromMenu() {
      if (state.isNewCustomer) {
        state.isNewCustomer = false;
        state.newDisplayName = '';
        setStep('customer');
      } else if (state.customer && state.customer.lastReservation) {
        setStep('repeat_choice');
      } else {
        state.customer = null;
        setStep('customer');
      }
    }

    function updateMenu() {
      state.menuId = document.getElementById('menuSelect').value || null;
    }

    function updateStaff() {
      state.staffId = document.getElementById('staffSelect').value || 'staff-00';
    }

    function goMenuNext() {
      if (state.isNewCustomer) {
        if (!document.getElementById('newDisplayName').value.trim()) {
          showMessage('お客様のお名前を入力してください。', false);
          return;
        }
        state.newDisplayName = document.getElementById('newDisplayName').value.trim();
      }
      if (!state.menuId || !state.staffId) {
        showMessage('メニューと担当を選んでください。', false);
        return;
      }
      state.time = null;
      setStep('datetime');
    }

    function handleDateChange() {
      state.date = document.getElementById('dateInput').value;
      loadAvailableSlots();
    }

    function loadAvailableSlots() {
      state.availableSlots = [];
      var slotsDiv = document.getElementById('timeSlots');
      if (slotsDiv) slotsDiv.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:16px;">読み込み中…</div>';

      gasRun('gasGetAvailability', {
        date: state.date,
        staffId: state.staffId,
        durationMinutes: getSelectedMenuDuration(),
      }, function(result) {
        if (result.success && result.slots) {
          state.availableSlots = result.slots;
        } else {
          showMessage('空き枠の取得に失敗しました: ' + JSON.stringify(result), false);
        }
        render();
      }, function(e) {
        var msg = e && e.message ? e.message : String(e);
        showMessage('GASエラー: ' + msg, false);
        var sd = document.getElementById('timeSlots');
        if (sd) sd.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--danger);padding:16px;">エラー: ' + msg + '</div>';
      });
    }

    function getSelectedMenuDuration() {
      var menu = MENUS.find(function(m) { return m.id === state.menuId; });
      return menu ? menu.durationMinutes : 60;
    }

    function selectTime(time) {
      state.time = time;
      render();
    }

    function backFromDatetime() {
      state.time = null;
      if (state.useLastContent === true && state.customer && state.customer.lastReservation) {
        setStep('repeat_choice');
      } else {
        setStep('menu');
      }
    }

    function goDatetimeNext() {
      if (!state.time) {
        showMessage('開始時刻を選んでください。', false);
        return;
      }
      setStep('confirm');
    }

    function backFromConfirm() {
      setStep('datetime');
    }

    function submitReservation() {
      var displayName = state.isNewCustomer ? state.newDisplayName : state.customer.displayName;
      var menu = MENUS.find(function(m) { return m.id === state.menuId; });
      var staff = STAFF_LIST.find(function(s) { return s.id === state.staffId; });

      if (!menu || !staff || !state.time) {
        showMessage('入力が不完全です。', false);
        return;
      }

      document.getElementById('submitBtn').disabled = true;

      var body = {
        customerName: displayName,
        menuName: menu.name,
        durationMinutes: menu.durationMinutes,
        price: menu.price,
        staffId: state.staffId,
        staffName: staff.name,
        date: state.date,
        time: state.time,
        notes: 'GAS HTML Service',
        customerId: state.customer ? state.customer.customerId : '',
      };

      if (state.isNewCustomer) {
        gasRun('gasRegisterStoreCustomer', {
          displayName: displayName,
          searchKana: displayName,
          phone: '',
        }, function(result) {
          if (result.success && result.customerId) {
            body.customerId = result.customerId;
            createReservationFinal(body);
          } else {
            document.getElementById('submitBtn').disabled = false;
            showMessage(result.error || '顧客登録に失敗しました。', false);
          }
        });
      } else {
        createReservationFinal(body);
      }
    }

    function createReservationFinal(body) {
      gasRun('gasCreateReservation', body, function(result) {
        document.getElementById('submitBtn').disabled = false;
        if (result.success) {
          showMessage('予約を登録しました。', true);
          loadCustomers();
          resetState();
        } else {
          showMessage(result.error || '予約登録に失敗しました。', false);
        }
      });
    }

    // ============================================================
    // Cancel Flow
    // ============================================================

    function loadCancelReservations(cust) {
      gasRun('gasGetCancellableReservations', {
        customerId: cust.customerId,
        displayName: cust.displayName,
      }, function(result) {
        if (result.success && result.reservations) {
          state.cancelReservations = result.reservations;
        } else {
          state.cancelReservations = [];
        }
        setStep('cancel_select');
      });
    }

    function selectCancelReservation(eventId) {
      state.selectedEventId = eventId;
      setStep('cancel_confirm');
    }

    function goBackToCancelSelect() {
      state.selectedEventId = null;
      setStep('cancel_select');
    }

    function submitCancel() {
      if (!state.selectedEventId) return;
      document.getElementById('cancelBtn').disabled = true;

      gasRun('gasCancelReservation', {
        eventId: state.selectedEventId,
      }, function(result) {
        document.getElementById('cancelBtn').disabled = false;
        if (result.success) {
          showMessage('キャンセルが完了しました。', true);
          loadCustomers();
          resetState();
        } else {
          showMessage(result.error || 'キャンセルに失敗しました。', false);
        }
      });
    }

    // ============================================================
    // Rendering
    // ============================================================

    function render() {
      renderProgressBar();
      renderPanels();
      renderCustomerPanel();
    }

    function renderProgressBar() {
      var bar = document.getElementById('progressBar');
      var steps = state.mode === 'book'
        ? ['customer', 'menu', 'datetime', 'confirm']
        : ['customer', 'cancel_select', 'cancel_confirm'];

      // repeat_choice maps to customer for progress bar purposes
      var progressStep = state.step === 'repeat_choice' ? 'customer' : state.step;

      bar.innerHTML = '';
      steps.forEach(function(s, i) {
        var li = document.createElement('li');
        var labels = {
          customer: 'お客様',
          menu: 'メニュー',
          datetime: '日時',
          confirm: '確認',
          cancel_select: '予約選択',
          cancel_confirm: 'キャンセル確認',
        };
        li.textContent = (i + 1) + '. ' + labels[s];
        var stepIdx = steps.indexOf(progressStep);
        if (s === progressStep) {
          li.className = 'active';
        } else if (steps.indexOf(s) < stepIdx) {
          li.className = 'done';
        }
        bar.appendChild(li);
      });
    }

    function renderPanels() {
      var panelMap = {
        customer: 'panelCustomer',
        repeat_choice: 'panelRepeatChoice',
        menu: 'panelMenu',
        datetime: 'panelDateTime',
        confirm: 'panelConfirm',
        cancel_select: 'panelCancelSelect',
        cancel_confirm: 'panelCancelConfirm',
      };

      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });

      if (state.mode === 'book') {
        var el = document.getElementById(panelMap[state.step]);
        if (el) el.classList.add('active');

        if (state.step === 'repeat_choice' && state.customer && state.customer.lastReservation) {
          renderRepeatChoicePanel();
        }
        if (state.step === 'menu') renderMenuPanel();
        if (state.step === 'datetime') renderDatetimePanel();
        if (state.step === 'confirm') renderConfirmPanel();
      } else {
        var el = document.getElementById(panelMap[state.step]);
        if (el) el.classList.add('active');

        if (state.step === 'cancel_select') renderCancelSelectPanel();
        if (state.step === 'cancel_confirm') renderCancelConfirmPanel();
      }

      if (state.step === 'customer') {
        document.getElementById('panelCustomer').classList.add('active');
      }
    }

    function renderCustomerPanel() {
      var search = document.getElementById('searchInput').value.trim();
      var { repeaters, others, search: searchResults } = rankCustomers(search);

      document.getElementById('repeatersContainer').style.display = search ? 'none' : 'block';
      document.getElementById('searchResultsContainer').style.display = search ? 'block' : 'none';
      document.getElementById('allCustomersContainer').style.display = search ? 'none' : 'block';

      // Repeaters
      document.getElementById('repeatersList').innerHTML = '';
      repeaters.forEach(function(c) {
        renderCustomerButton(c, true, document.getElementById('repeatersList'));
      });

      // Search Results
      if (searchResults) {
        document.getElementById('searchResultsList').innerHTML = '';
        searchResults.forEach(function(c) {
          renderCustomerButton(c, false, document.getElementById('searchResultsList'));
        });
      }

      // All Customers
      document.getElementById('allCustomersList').innerHTML = '';
      others.forEach(function(c) {
        renderCustomerButton(c, false, document.getElementById('allCustomersList'));
      });
    }

    function renderCustomerButton(cust, isRepeater, container) {
      var btn = document.createElement('button');
      btn.className = 'customer-button' + (isRepeater ? ' repeater' : '');
      btn.onclick = function() { pickCustomer(cust); };

      var nameDiv = document.createElement('div');
      nameDiv.className = 'customer-name';
      nameDiv.textContent = cust.displayName;
      if (isRepeater) {
        var badge = document.createElement('span');
        badge.className = 'repeater-badge';
        badge.textContent = 'リピート';
        nameDiv.appendChild(badge);
      }

      var kanaDiv = document.createElement('div');
      kanaDiv.className = 'customer-kana';
      kanaDiv.textContent = 'ヨミ: ' + cust.searchKana;

      btn.appendChild(nameDiv);
      btn.appendChild(kanaDiv);

      if (cust.lastReservation) {
        var lastDiv = document.createElement('div');
        lastDiv.className = 'customer-last-visit';
        lastDiv.textContent = '前回 ' + cust.lastReservation.date.replace(/-/g, '/') + ' · ' + (cust.lastReservation.menuName || '—');
        btn.appendChild(lastDiv);
      }

      container.appendChild(btn);
    }

    function renderRepeatChoicePanel() {
      var last = state.customer.lastReservation;
      // GAS returns menuName (string), not menuId — look up durationMinutes if possible
      var menuName = last.menuName || '—';
      var menuObj = MENUS.find(function(m) { return m.name === menuName; });
      var staff = STAFF_LIST.find(function(s) { return s.id === last.staffId; });

      var html = '<div class="repeat-choice-message">';
      html += '<strong>' + state.customer.displayName + '</strong>様 — いちばん早いのは<strong>「前回と同じ」</strong>です。</div>';
      html += '<div class="repeat-content-box">';
      html += '<div class="repeat-content-label">前回の内容</div>';
      html += '<div class="repeat-content-text">' + menuName + ' / ' + (staff ? staff.name : '—');
      if (menuObj) html += '（約' + menuObj.durationMinutes + '分）';
      html += '</div></div>';

      document.getElementById('repeatChoiceContent').innerHTML = html;
    }

    function renderMenuPanel() {
      document.getElementById('menuSelect').innerHTML = '<option value="">選択してください</option>';
      MENUS.forEach(function(m) {
        var opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name + '（' + m.durationMinutes + '分・¥' + m.price.toLocaleString() + '）';
        opt.selected = state.menuId === m.id;
        document.getElementById('menuSelect').appendChild(opt);
      });

      document.getElementById('staffSelect').innerHTML = '';
      STAFF_LIST.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        opt.selected = state.staffId === s.id;
        document.getElementById('staffSelect').appendChild(opt);
      });

      if (state.isNewCustomer) {
        document.getElementById('newCustomerNameField').style.display = 'block';
        document.getElementById('existingCustomerDisplay').style.display = 'none';
        document.getElementById('newDisplayName').value = state.newDisplayName;
      } else {
        document.getElementById('newCustomerNameField').style.display = 'none';
        document.getElementById('existingCustomerDisplay').style.display = 'block';
        document.getElementById('existingCustomerName').textContent = state.customer.displayName;
      }
    }

    function renderDatetimePanel() {
      document.getElementById('dateInput').value = state.date;

      if (state.useLastContent === true && state.customer && state.customer.lastReservation) {
        var menu = MENUS.find(function(m) { return m.id === state.customer.lastReservation.menuId; });
        var staff = STAFF_LIST.find(function(s) { return s.id === state.customer.lastReservation.staffId; });
        document.getElementById('repeatContentDisplay').style.display = 'block';
        document.getElementById('repeatContentText').textContent = (menu ? menu.name : '—') + ' · ' + (staff ? staff.name : '—');
        if (menu) document.getElementById('repeatContentText').textContent += ' · 約' + menu.durationMinutes + '分';
      } else {
        document.getElementById('repeatContentDisplay').style.display = 'none';
      }

      var slotsDiv = document.getElementById('timeSlots');
      slotsDiv.innerHTML = '';
      state.availableSlots.forEach(function(slot) {
        var btn = document.createElement('button');
        btn.className = 'time-button';
        btn.textContent = slot.time;
        if (!slot.available) {
          btn.disabled = true;
        } else {
          btn.onclick = function() { selectTime(slot.time); };
        }
        if (state.time === slot.time) {
          btn.classList.add('active');
        }
        slotsDiv.appendChild(btn);
      });
    }

    function renderConfirmPanel() {
      var menu = MENUS.find(function(m) { return m.id === state.menuId; });
      var staff = STAFF_LIST.find(function(s) { return s.id === state.staffId; });
      var displayName = state.isNewCustomer ? state.newDisplayName : state.customer.displayName;

      document.getElementById('repeatBadge').style.display = state.useLastContent === true ? 'block' : 'none';
      document.getElementById('confirmCustomerName').textContent = displayName;
      document.getElementById('confirmMenuName').textContent = menu ? menu.name : '—';
      document.getElementById('confirmStaffName').textContent = staff ? staff.name : '—';
      document.getElementById('confirmDateTime').textContent = state.date.replace(/-/g, '/') + ' ' + state.time + '〜';
    }

    function renderCancelSelectPanel() {
      document.getElementById('cancelSelectTitle').textContent = state.customer.displayName;

      var list = document.getElementById('cancelReservationsList');
      list.innerHTML = '';

      if (state.cancelReservations.length === 0) {
        list.innerHTML = '<div class="empty-message">キャンセル可能な予約がありません。</div>';
        return;
      }

      state.cancelReservations.forEach(function(res) {
        var btn = document.createElement('button');
        btn.className = 'customer-button';
        btn.style.border = '1px solid var(--border)';
        btn.onclick = function() { selectCancelReservation(res.eventId); };

        var dateDiv = document.createElement('div');
        dateDiv.style.cssText = 'font-weight: 600; color: var(--text-primary); margin-bottom: 4px;';
        dateDiv.textContent = res.date + ' ' + res.time;

        var menuDiv = document.createElement('div');
        menuDiv.style.cssText = 'color: var(--text-secondary); font-size: 12px;';
        menuDiv.textContent = res.menuName;

        btn.appendChild(dateDiv);
        btn.appendChild(menuDiv);
        list.appendChild(btn);
      });
    }

    function renderCancelConfirmPanel() {
      var res = state.cancelReservations.find(function(r) { return r.eventId === state.selectedEventId; });
      if (!res) return;

      var html = '<div class="reservation-date">' + res.date + ' ' + res.time + '</div>';
      html += '<div class="reservation-menu">' + res.menuName + '</div>';
      var staff = STAFF_LIST.find(function(s) { return s.id === res.staffId; });
      html += '<div class="reservation-staff">' + (staff ? staff.name : res.staffId) + '</div>';

      document.getElementById('cancelConfirmContent').innerHTML = html;
    }

    function resetState() {
      state.mode = 'book';
      state.step = 'customer';
      state.customer = null;
      state.isNewCustomer = false;
      state.newDisplayName = '';
      state.menuId = null;
      state.staffId = 'staff-00';
      state.date = todayYmd();
      state.time = null;
      state.useLastContent = null;
      state.selectedEventId = null;
      state.cancelReservations = [];
      document.getElementById('searchInput').value = '';
      render();
    }

    // ============================================================
    // Initialize
    // ============================================================

    window.addEventListener('load', function() {
      loadCustomers();
    });
  </script>
</body>
</html>
